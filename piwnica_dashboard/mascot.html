<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Live2D character for mascot.py. Cubism Core (closed licence) and pixi + pixi-live2d-display come
// from the user's disk, never from this repo; mascot.py fills in MASCOT before loading the page.
const C = window.MASCOT = /*CONFIG*/{};

const script = (src) => new Promise((resolve, reject) => {
  const s = Object.assign(document.createElement('script'), { src });
  s.onload = resolve;
  s.onerror = () => reject(new Error(`cannot load ${src}`));
  document.head.appendChild(s);
});

const say = (msg) => window.webkit?.messageHandlers?.mascot?.postMessage(msg);

(async () => {
  try {
    await script(C.core);
    await script(C.pixi);
    await script(C.cubism4);
  } catch (e) {
    say(`error: ${e.message}`);
    return;
  }
  const { PIXI } = window;
  const { width, height } = C;
  const view = document.getElementById('c');
  if (C.fade > 0) {  // a waist-up model ends in mid-air: its bottom part fades out instead of a hard cut
    const m = `linear-gradient(to bottom, #000 ${Math.round((1 - C.fade) * 100)}%, transparent 100%)`;
    view.style.maskImage = view.style.webkitMaskImage = m;
  }
  const app = new PIXI.Application({ view, width, height, backgroundAlpha: 0, antialias: true, autoStart: true });
  app.ticker.maxFPS = C.fps;

  let model;
  try {
    model = await PIXI.live2d.Live2DModel.from(C.model, { autoInteract: false });
  } catch (e) {
    say(`error: model: ${e.message}`);
    return;
  }
  // [mascot] idle_skip: the random rest motion is drawn from the other Idle motions only
  // (set before the first idle starts; mascot.play() still plays any of them)
  const mm = model.internalModel.motionManager;
  const skip = new Set(C.idle_skip || []);
  const idles = (mm.definitions[mm.groups.idle] || []).map((_, i) => i).filter((i) => !skip.has(i));
  if (skip.size && idles.length) {
    const random = mm.startRandomMotion.bind(mm);
    mm.startRandomMotion = (group, priority) => group === mm.groups.idle
      ? mm.startMotion(group, idles[Math.floor(Math.random() * idles.length)], priority)
      : random(group, priority);
  }

  // the (waist-up) model stands on the bottom edge, as large as the box allows
  const s = Math.min(width / model.internalModel.width, height / model.internalModel.height) * C.zoom;
  model.scale.set(s);
  model.anchor.set(0.5, 1);
  model.position.set(width / 2, height);
  app.stage.addChild(model);

  // where the eyes are, in canvas pixels: C.eyes = fraction of the model's height from its top
  const eyeX = width / 2;
  const eyeY = height - model.height * (1 - C.eyes);
  const focus = model.internalModel.focusController;

  window.mascot = {
    // cursor in canvas pixels (anywhere on the desktop, also outside the canvas): the head and the
    // eyes turn towards it, fully once it is `reach` px away, less when it is close to the face
    look(x, y) {
      const dx = x - eyeX, dy = y - eyeY;
      const d = Math.hypot(dx, dy);
      const k = Math.min(1, d / C.reach) / (d || 1);
      focus.focus(dx * k, -dy * k);
    },
    pause(p) {
      p ? app.ticker.stop() : app.ticker.start();
      p ? rest() : plan();
    },
    // mascot-holdout: play the i-th Idle motion now (priority FORCE) to catch every rest pose
    play(i) { model.motion('Idle', i, P.FORCE); },
    // mascot-holdout: parts left out of the outline (e.g. a tail the panels may cover), by part id
    hide(ids) {
      hidden = ids.filter((id) => model.internalModel.coreModel.getPartIndex(id) >= 0);
    },
    // any motion group or expression of the model by name, now (mascot-acts, and to try one out)
    act(name) {
      if (groups[name]) return model.motion(name, 0, P.FORCE);
      return Promise.resolve(emote(name, 6000));
    },
  };

  let hidden = [];
  model.internalModel.on('beforeModelUpdate', () => {
    for (const id of hidden) model.internalModel.coreModel.setPartOpacityById(id, 0);
  });

  // [mascot] acts: now and then a gesture, a face or a dance instead of standing still. One timer
  // between two acts and the frames the ticker draws anyway: nothing here runs per frame.
  const A = C.acts || {};
  const P = PIXI.live2d.MotionPriority;
  const groups = model.internalModel.settings.motions || {};
  const WEIGHT = { gesture: 5, emote: 3, idle: 2, dance: 1 };
  const kinds = Object.keys(WEIGHT).filter((k) => (A[k] || []).length);
  const plain = new Set(A.plain || []);
  // faces that go with a motion which leaves the face alone
  const cheer = ['happy', 'joy', 'amused', 'gentle', 'wink', 'sparkle', 'confident', 'calm', 'curious', 'warm']
    .filter((n) => (A.emote || []).includes(n));
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const bags = {}; // per kind: every name once in random order before any comes again
  const draw = (k) => {
    if (!bags[k]?.length) {
      bags[k] = [...A[k]].sort(() => Math.random() - 0.5);
      if (bags[k].length > 1 && bags[k][bags[k].length - 1] === bags[k].last) bags[k].reverse();
    }
    return (bags[k].last = bags[k].pop());
  };
  let actT = null, faceT = null, cur = null; // cur = { name, left } while an act's motion plays

  function emote(name, ms) {
    const em = mm.expressionManager;
    if (!em) return false;
    model.expression(name);
    clearTimeout(faceT);
    faceT = setTimeout(() => em.resetExpression(), ms);
    return true;
  }
  function rest() {
    clearTimeout(actT);
    clearTimeout(faceT);
    actT = cur = null;
    mm.expressionManager?.resetExpression();
  }
  function plan() {
    clearTimeout(actT);
    actT = kinds.length ? setTimeout(act, rand(A.every[0], A.every[1]) * 1000) : null;
  }
  function act() {
    let r = Math.random() * kinds.reduce((sum, k) => sum + WEIGHT[k], 0);
    const kind = kinds.find((k) => (r -= WEIGHT[k]) < 0) || kinds[0];
    const name = draw(kind);
    if (A.log) say(`act ${kind} ${name}`);
    if (kind === 'emote') {
      emote(name, rand(4000, 8000));
      return plan();
    }
    cur = { name, left: kind === 'dance' ? Math.floor(rand(1, 4)) : 0 }; // a dance: 2 to 4 rounds
    // should the motion never report its end (something else took over), the acts go on anyway
    actT = setTimeout(() => { cur = null; plan(); }, 90000);
    model.motion(name, 0, P.NORMAL).then((ok) => {
      if (cur?.name !== name) return;
      if (!ok) { cur = null; return plan(); }
      // after the start: a motion above idle priority resets the face when it begins
      if (plain.has(name) && cheer.length && Math.random() < 0.5) emote(cheer[Math.floor(Math.random() * cheer.length)], 5000);
    });
  }
  // the act's motion ended: another round of the dance, or back to resting until the next act.
  // (The library does not loop motions outside Idle and refuses to restart the one it still counts
  // as playing, so the next round starts from a stopped manager, after this event.)
  // A motion fades out before its parameters are back at rest, and the Idle motions never touch
  // most of them: a sweat drop, an open mouth or half an eye variant would stay on the face. For a
  // moment after a motion outside Idle ends, every parameter eases to its default (between loading
  // and saving the parameters, so it lasts); the ones Idle animates are written over right after.
  const core = model.internalModel.coreModel;
  let easeUntil = 0;
  const update = mm.update.bind(mm);
  mm.update = (m, now) => {
    if (easeUntil) {
      const last = performance.now() >= easeUntil;
      for (let i = 0; i < core.getParameterCount(); i++) {
        const v = core.getParameterValueByIndex(i), d = core.getParameterDefaultValue(i);
        if (v !== d) core.setParameterValueByIndex(i, last ? d : v + (d - v) * 0.25);
      }
      if (last) easeUntil = 0;
    }
    return update(m, now);
  };
  mm.on('motionFinish', () => {
    if (mm.state.currentGroup !== mm.groups.idle) easeUntil = performance.now() + 600;
    if (!cur || mm.state.currentGroup !== cur.name) return;
    if (cur.left > 0) {
      const { name } = cur;
      cur.left -= 1;
      setTimeout(() => {
        if (cur?.name !== name) return;
        mm.stopAllMotions();
        model.motion(name, 0, P.FORCE);
      }, 0);
    } else {
      cur = null;
      plan();
    }
  });
  plan();
  say(`ready ${Math.round(model.width)}x${Math.round(model.height)} eyes ${Math.round(eyeX)},${Math.round(eyeY)}`);
})();
</script>
</body>
</html>
